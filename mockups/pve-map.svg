<!-- legenda -->
<rect x="20" y="650" width="1360" height="135" rx="10" fill="#1c1410" opacity="0.88"/>
<use href="#deurBoven" x="50" y="728"/>
<text x="92" y="690" font-size="14" fill="#45e07a" font-weight="bold">Nieuwe deur boven (op de galerij)</text>
<text x="92" y="708" font-size="12" fill="#f1e2cf">Twee per huis. Slaat open, vijand stapt eruit,</text>
<text x="92" y="724" font-size="12" fill="#f1e2cf">deur valt dicht met een klap. Max 5 boven tegelijk.</text>
<use href="#deurBeneden" x="440" y="728"/>
<text x="470" y="690" font-size="14" fill="#ff9a3c" font-weight="bold">Deur beneden (bestaand deurgat)</text>
<text x="470" y="708" font-size="12" fill="#f1e2cf">Hier komen vijanden de straat op,</text>
<text x="470" y="724" font-size="12" fill="#f1e2cf">ook zodra boven vol zit.</text>
<line x1="770" y1="690" x2="810" y2="690" stroke="#ff5a4f" stroke-width="4" marker-end="url(#pijl)"/>
<text x="822" y="694" font-size="14" fill="#ff5a4f" font-weight="bold">Zijkant</text>
<text x="770" y="712" font-size="12" fill="#f1e2cf">Vijanden lopen het beeld in.</text>
<use href="#tonplek" x="790" y="760"/><text x="808" y="752" font-size="12" fill="#ffd36b">mogelijke tonplek (straat,</text><text x="808" y="767" font-size="12" fill="#ffd36b">galerij, daken, kramen)</text>
<rect x="1010" y="680" width="30" height="40" rx="10" fill="none" stroke="#c77dff" stroke-width="3" stroke-dasharray="5 4"/>
<text x="1050" y="690" font-size="14" fill="#c77dff" font-weight="bold">Optie B</text>
<text x="1050" y="708" font-size="12" fill="#f1e2cf">Deur hoog in het middenhuis,</text>
<text x="1050" y="724" font-size="12" fill="#f1e2cf">alleen voor kruisboogschutters?</text>
<text x="1050" y="740" font-size="12" fill="#f1e2cf">Niet te bereiken, wel te raken</text>
<text x="1050" y="756" font-size="12" fill="#f1e2cf">met een worp.</text>
</svg>
