<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="Arial, sans-serif">
<defs>
 <linearGradient id="lucht" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2140"/><stop offset="1" stop-color="#c9774a"/></linearGradient>
 <pattern id="leem" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#c99a63"/><circle cx="4" cy="5" r="1" fill="#b4834f"/><circle cx="10" cy="11" r="1" fill="#b4834f"/></pattern>
 <pattern id="leem2" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#b88a58"/><circle cx="4" cy="5" r="1" fill="#a07445"/></pattern>
 <marker id="pijl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff5a4f"/></marker>
 <g id="ton"><rect x="-11" y="-28" width="22" height="28" rx="6" fill="#7a4a24" stroke="#3a220f" stroke-width="2"/><line x1="-11" y1="-20" x2="11" y2="-20" stroke="#3a220f" stroke-width="2"/><line x1="-11" y1="-8" x2="11" y2="-8" stroke="#3a220f" stroke-width="2"/></g>
 <g id="tonplek"><rect x="-11" y="-28" width="22" height="28" rx="6" fill="none" stroke="#ffd36b" stroke-width="2" stroke-dasharray="4 3"/></g>
 <g id="deurBeneden"><rect x="-16" y="-62" width="32" height="62" rx="14" fill="#3a2414"/><rect x="-16" y="-62" width="32" height="62" rx="14" fill="none" stroke="#ff9a3c" stroke-width="3"/></g>
 <g id="deurBoven"><rect x="-16" y="-62" width="32" height="62" rx="14" fill="#1a0f08"/><path d="M16,-58 L34,-50 L34,-4 L16,0 z" fill="#8a5a2b" stroke="#4a2c12" stroke-width="2"/><rect x="-16" y="-62" width="32" height="62" rx="14" fill="none" stroke="#45e07a" stroke-width="3"/></g>
 <g id="amir"><circle cx="0" cy="-80" r="9" fill="#5a3a22"/><rect x="-7" y="-70" width="14" height="40" rx="5" fill="#d9c7a0"/><rect x="-6" y="-30" width="5" height="30" fill="#5a3a22"/><rect x="1" y="-30" width="5" height="30" fill="#5a3a22"/><line x1="-14" y1="-95" x2="14" y2="-20" stroke="#ccc" stroke-width="2"/></g>
</defs>
<rect width="1400" height="800" fill="url(#lucht)"/>
<text x="20" y="34" font-size="24" font-weight="bold" fill="#fff">PvE: The Dye Yard (mockup, zijaanzicht)</text>
<text x="20" y="58" font-size="14" fill="#f1e2cf">Schematisch, niet op schaal tot op de pixel. Amir loopt naar links; rechts begint de host.</text>

