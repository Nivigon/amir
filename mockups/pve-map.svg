<text x="64" y="300" font-size="12" fill="#f1e2cf">rotswand</text>
<text x="1310" y="300" font-size="12" fill="#f1e2cf">rand</text>
<line x1="1385" y1="310" x2="1385" y2="620" stroke="#f1e2cf" stroke-dasharray="6 5"/>

<!-- huizen -->
