<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amir - Nieuwe stijl maker</title>
<style>
  html,body{margin:0;height:100%;background:#0a0b0d;color:#dfe3e6;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
  #wrap{display:flex;height:100%}
  #bar{width:208px;flex:0 0 208px;background:#15171b;border-right:1px solid #262a30;overflow:auto;padding:10px}
  #bar h3{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8a93a0}
  #bar h3:first-child{margin-top:0}
  button{display:block;width:100%;margin:4px 0;padding:7px 8px;background:#242932;color:#e7ebef;border:1px solid #333a44;border-radius:6px;cursor:pointer;text-align:left;font-size:13px}
  button:hover{background:#2d333e}
  button.aan{background:#2b5d53;border-color:#357a6c}
  .rij{display:flex;gap:4px}
  .rij button{margin:4px 0}
  label.sl{display:block;margin:8px 0 2px;font-size:12px;color:#aab2bd}
  input[type=range]{width:100%}
  #hint{margin-top:12px;font-size:11px;color:#79828e;border-top:1px solid #262a30;padding-top:8px}
  #stage{flex:1;position:relative}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <h3>Achtergrond</h3>
    <button id="bgtoggle" class="aan">Achtergrond-steen: aan</button>
    <label class="sl">Achtergrond helderheid</label>
    <input id="bghelder" type="range" min="10" max="100" value="42">

    <h3>Zwart terrein</h3>
    <button data-add="vloer">Vloer-rand</button>
    <button data-add="vloer_rots">Vloer-rand (rots)</button>
    <button data-add="plafond">Plafond-tandjes</button>
    <button data-add="wand">Wand</button>
    <button data-add="klif">Klif / terras-rand</button>
    <button data-add="richel">Richel</button>

    <h3>Voorgrond-vormen</h3>
    <button data-add="blok">Zwart blok</button>
    <button data-add="blob">Zwarte blob</button>
    <button id="rimtoggle">Randlicht op vormen: uit</button>

    <h3>Selectie</h3>
    <label class="sl">Schaal</label>
    <input id="schaal" type="range" min="5" max="400" value="100">
    <label class="sl">Draaien</label>
    <input id="draai" type="range" min="0" max="360" value="0">
    <label class="sl">Doorzicht</label>
    <input id="alpha" type="range" min="5" max="100" value="100">
    <div class="rij">
      <button id="voor">Naar voren</button>
      <button id="achter">Naar achter</button>
    </div>
    <div class="rij">
      <button id="dup">Dupliceer</button>
      <button id="del">Verwijder</button>
    </div>
    <button id="leeg">Alles weg</button>

    <div id="hint">
      Klik een stuk om het toe te voegen. Sleep het lijf om te verplaatsen, sleep
      een hoekje om te schalen (vrij, geen grid). Scrollwiel op een selectie
      schaalt ook. Delete verwijdert. De zwarte vormen leg je over alles heen
      voor de schaduwtruc.
    </div>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
</div>
<script>
const cv=document.getElementById('c'), x=cv.getContext('2d');
let DPR=Math.min(2,window.devicePixelRatio||1), VW=0, VH=0;
function resize(){ const r=cv.parentElement.getBoundingClientRect(); VW=r.width; VH=r.height; cv.width=VW*DPR; cv.height=VH*DPR; x.setTransform(DPR,0,0,DPR,0,0); draw(); }
window.addEventListener('resize',resize);

// ---- assets ----
const SRC={
  vloer:'design/zwart/grondrand.png',
  vloer_rots:'design/zwart/grondrand_rots.png',
  plafond:'design/zwart/plafond_strook.png',
  wand:'design/zwart/wand_rand.png',
  klif:'design/zwart/klif_bovenrand.png',
  richel:'design/zwart/wand_richel.png',
};
const IMG={}; let geladen=0, nodig=Object.keys(SRC).length+1;
for(const k in SRC){ const im=new Image(); im.onload=()=>{geladen++;draw();}; im.src=SRC[k]; IMG[k]=im; }
const BG=new Image(); BG.onload=()=>{geladen++;draw();}; BG.src='design/grot/rots_vulling.png';

// ---- staat ----
let items=[];          // {kind,cx,cy,w,h,rot,alpha, seed?}
let sel=null;
let bgAan=true, bgHelder=0.42, rimAan=false;

function blobPunten(seed){
  // grillige gesloten vorm, genormaliseerd op straal 0.5
  let rnd=mulberry(seed), n=14, p=[];
  for(let i=0;i<n;i++){ let a=i/n*Math.PI*2; let r=0.32+rnd()*0.18; p.push([Math.cos(a)*r, Math.sin(a)*r]); }
  return p;
}
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function defGrootte(kind){
  if(kind==='blok') return [220,220];
  if(kind==='blob') return [260,220];
  const im=IMG[kind];
  let w=Math.min(VW*0.6, 520), h=im&&im.width? w*im.height/im.width : 120;
  if(kind==='plafond'){ h=w*0.34; }
  return [w,h];
}
function add(kind){
  const [w,h]=defGrootte(kind);
  let it={kind,cx:VW/2,cy:VH/2,w,h,rot:0,alpha:1,seed:(Math.random()*1e9)|0};
  if(kind==='plafond') it.cy=h/2+10;
  else if(kind==='vloer'||kind==='vloer_rots') it.cy=VH-h/2+h*0.55;
  items.push(it); select(it); draw();
}

function select(it){ sel=it; syncPanel(); }
function syncPanel(){
  const S=document.getElementById('schaal'),D=document.getElementById('draai'),A=document.getElementById('alpha');
  if(sel){ S.value=100; D.value=Math.round(sel.rot*180/Math.PI); A.value=Math.round(sel.alpha*100); }
}

// ---- tekenen ----
function draw(){
  x.clearRect(0,0,VW,VH);
  // achtergrond-steen
  if(bgAan && BG.complete && BG.width){
    const tw=VW, th=tw*BG.height/BG.width;
    x.save(); x.globalAlpha=1;
    for(let y=0;y<VH;y+=th) x.drawImage(BG,0,y,tw,th);
    // dimmen
    x.fillStyle='rgba(0,0,0,'+(1-bgHelder)+')'; x.fillRect(0,0,VW,VH);
    // zachte gloed in het midden
    let g=x.createRadialGradient(VW/2,VH/2,0,VW/2,VH/2,Math.max(VW,VH)*0.5);
    g.addColorStop(0,'rgba(120,125,135,0.10)'); g.addColorStop(1,'rgba(120,125,135,0)');
    x.fillStyle=g; x.fillRect(0,0,VW,VH);
    x.restore();
  } else {
    x.fillStyle='#0c0d10'; x.fillRect(0,0,VW,VH);
  }
  for(const it of items) tekenItem(it);
  if(sel) tekenSelectie(sel);
}
function tekenItem(it){
  x.save();
  x.globalAlpha=it.alpha;
  x.translate(it.cx,it.cy); x.rotate(it.rot);
  if(it.kind==='blok'){
    x.fillStyle='#000'; x.fillRect(-it.w/2,-it.h/2,it.w,it.h);
    if(rimAan){ x.strokeStyle='rgba(180,186,180,0.5)'; x.lineWidth=2; x.strokeRect(-it.w/2,-it.h/2,it.w,it.h); }
  } else if(it.kind==='blob'){
    const p=blobPunten(it.seed);
    x.beginPath();
    for(let i=0;i<p.length;i++){ let X=p[i][0]*it.w, Y=p[i][1]*it.h; i?x.lineTo(X,Y):x.moveTo(X,Y); }
    x.closePath(); x.fillStyle='#000'; x.fill();
    if(rimAan){ x.strokeStyle='rgba(180,186,180,0.4)'; x.lineWidth=2; x.stroke(); }
  } else {
    const im=IMG[it.kind];
    if(im&&im.complete&&im.width) x.drawImage(im,-it.w/2,-it.h/2,it.w,it.h);
  }
  x.restore();
}
function hoeken(it){ // wereldposities van de 4 hoeken
  const c=Math.cos(it.rot),s=Math.sin(it.rot),hw=it.w/2,hh=it.h/2;
  return [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([lx,ly])=>[it.cx+lx*c-ly*s, it.cy+lx*s+ly*c]);
}
function tekenSelectie(it){
  const h=hoeken(it);
  x.save(); x.strokeStyle='#4ea1ff'; x.lineWidth=1.5; x.setLineDash([5,4]);
  x.beginPath(); h.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])); x.closePath(); x.stroke();
  x.setLineDash([]); x.fillStyle='#4ea1ff';
  h.forEach(p=>{ x.beginPath(); x.rect(p[0]-5,p[1]-5,10,10); x.fill(); });
  x.restore();
}

// ---- muis: selecteren, verplaatsen, schalen ----
function lokaal(it,px,py){ const c=Math.cos(-it.rot),s=Math.sin(-it.rot),dx=px-it.cx,dy=py-it.cy; return [dx*c-dy*s, dx*s+dy*c]; }
function raak(it,px,py){ const [lx,ly]=lokaal(it,px,py); return Math.abs(lx)<=it.w/2 && Math.abs(ly)<=it.h/2; }
function hoekRaak(it,px,py){ const h=hoeken(it); for(let i=0;i<4;i++){ if(Math.hypot(px-h[i][0],py-h[i][1])<=9) return i; } return -1; }

let modus=null, anker=null;
function muisPos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
cv.addEventListener('pointerdown',e=>{
  const [px,py]=muisPos(e);
  if(sel){ const hi=hoekRaak(sel,px,py); if(hi>=0){ modus='schaal'; const h=hoeken(sel); anker=h[(hi+2)%4]; cv.setPointerCapture(e.pointerId); return; } }
  // van boven naar onder zoeken
  let gevonden=null;
  for(let i=items.length-1;i>=0;i--){ if(raak(items[i],px,py)){ gevonden=items[i]; break; } }
  if(gevonden){ select(gevonden); modus='sleep'; anker=[px-gevonden.cx, py-gevonden.cy]; cv.setPointerCapture(e.pointerId); }
  else { sel=null; }
  draw();
});
cv.addEventListener('pointermove',e=>{
  if(!modus||!sel) return;
  const [px,py]=muisPos(e);
  if(modus==='sleep'){ sel.cx=px-anker[0]; sel.cy=py-anker[1]; }
  else if(modus==='schaal'){
    const c=Math.cos(-sel.rot),s=Math.sin(-sel.rot), dx=px-anker[0], dy=py-anker[1];
    const ux=dx*c-dy*s, uy=dx*s+dy*c;         // in lokaal (ongedraaid) frame
    sel.w=Math.max(8,Math.abs(ux)); sel.h=Math.max(8,Math.abs(uy));
    sel.cx=(anker[0]+px)/2; sel.cy=(anker[1]+py)/2;
  }
  draw();
});
function eindig(e){ if(modus){ modus=null; try{cv.releasePointerCapture(e.pointerId);}catch(_){} } }
cv.addEventListener('pointerup',eindig); cv.addEventListener('pointercancel',eindig);

cv.addEventListener('wheel',e=>{
  if(!sel) return; e.preventDefault();
  const f=e.deltaY<0?1.08:1/1.08; sel.w*=f; sel.h*=f; draw();
},{passive:false});

window.addEventListener('keydown',e=>{
  if(e.key==='Delete'||e.key==='Backspace'){ if(sel){ items=items.filter(i=>i!==sel); sel=null; draw(); } }
});

// ---- knoppen ----
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
document.getElementById('bgtoggle').onclick=function(){ bgAan=!bgAan; this.classList.toggle('aan',bgAan); this.textContent='Achtergrond-steen: '+(bgAan?'aan':'uit'); draw(); };
document.getElementById('rimtoggle').onclick=function(){ rimAan=!rimAan; this.classList.toggle('aan',rimAan); this.textContent='Randlicht op vormen: '+(rimAan?'aan':'uit'); draw(); };
document.getElementById('bghelder').oninput=function(){ bgHelder=this.value/100; draw(); };
document.getElementById('schaal').oninput=function(){ if(!sel)return; const f=this.value/100; const [w0,h0]=defGrootte(sel.kind); sel.w=w0*f; sel.h=(sel.kind==='blok'||sel.kind==='blob'?h0:sel.w*(IMG[sel.kind]?IMG[sel.kind].height/IMG[sel.kind].width:1))* (sel.kind==='plafond'?1:1); if(sel.kind==='blok'||sel.kind==='blob') sel.h=h0*f; draw(); };
document.getElementById('draai').oninput=function(){ if(!sel)return; sel.rot=this.value*Math.PI/180; draw(); };
document.getElementById('alpha').oninput=function(){ if(!sel)return; sel.alpha=this.value/100; draw(); };
document.getElementById('voor').onclick=()=>{ if(!sel)return; items=items.filter(i=>i!==sel); items.push(sel); draw(); };
document.getElementById('achter').onclick=()=>{ if(!sel)return; items=items.filter(i=>i!==sel); items.unshift(sel); draw(); };
document.getElementById('dup').onclick=()=>{ if(!sel)return; let n=Object.assign({},sel); n.cx+=30; n.cy+=30; items.push(n); select(n); draw(); };
document.getElementById('del').onclick=()=>{ if(!sel)return; items=items.filter(i=>i!==sel); sel=null; draw(); };
document.getElementById('leeg').onclick=()=>{ items=[]; sel=null; draw(); };

// ---- startopstelling zodat je meteen iets ziet ----
function start(){
  resize();
  add('plafond'); add('vloer');
  let wand={kind:'wand',cx:VW*0.82,cy:VH*0.55,w:VW*0.26,h:VH*0.9,rot:0,alpha:1,seed:1};
  items.push(wand);
  add('blob'); sel.cx=VW*0.2; sel.cy=VH*0.62; sel.w=320; sel.h=300;
  sel=null; draw();
}
window.addEventListener('load',start);
</script>
</body>
</html>
